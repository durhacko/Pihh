name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Internal Markdown links resolve
        run: python scripts/check_links.py
  # Stack-specific jobs (lint, test, build) are added in the M1 "stack scaffold + CI" issue
  # once the idea and stack are selected. Do not add speculative jobs here before then.
